name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # <owner>.github.io  -> served from the domain root  -> base path ""
      # any other repo     -> served from /<repo>/          -> base path "/<repo>"
      - name: Compute base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          REPO_LC="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          if [[ "$REPO_LC" == *.github.io ]]; then
            BASE=""
          else
            BASE="/$REPO"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "Repository: $GITHUB_REPOSITORY -> NEXT_PUBLIC_BASE_PATH='$BASE'"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static export
        run: npm run build

      # Without this, Pages runs Jekyll, which drops the _next/ directory.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # --- QA gates (zero-dependency scripts; fail the build on broken paths / leaks) ---
      - name: Gate - every local URL resolves under the base path
        run: node tests/scripts/check-paths.mjs out --base "$NEXT_PUBLIC_BASE_PATH"

      - name: Gate - export sanity, privacy + contact-details scan, image budget, HTML lint
        run: node tests/scripts/check-export.mjs out --base "$NEXT_PUBLIC_BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
